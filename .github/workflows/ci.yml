name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (offline, sqlite + mock provider)
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          DEFAULT_AI_PROVIDER: mock
          AI_FALLBACK_CHAIN: mock
          AI_ROUTING_MODE: offline
          RATE_LIMIT_ENABLED: "false"
          JWT_SECRET: ci-test-secret-ci-test-secret-32bytes
        run: pytest -q

  migrations:
    name: Alembic migration applies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Upgrade head on a fresh DB
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
        run: alembic upgrade head

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm run test --if-present
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
